[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e37-cli"
version = "0.1.0"
description = "Orders and products out of the E37 webshop platform, from the terminal or any script."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only the E37 Admin web module (not built yet) uses it; the JSON APIs stay on urllib.
web = ["scrapling"]

[project.scripts]
e37 = "e37.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
